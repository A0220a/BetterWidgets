name: Feature request
description: Suggest an improvement to BetterWidgets.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Explain how you would use the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional ideas or existing approaches you have considered.
