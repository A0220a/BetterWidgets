name: Build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Repository hygiene
        run: python3 scripts/check-repository.py
      - name: Toolchain
        run: xcodebuild -version
      - name: Login-item checks with a fake service
        run: bash Tests/run-launch-at-login-checks.sh
      - name: Universal Release build
        run: |
          xcodebuild -project BetterWidgets.xcodeproj -scheme BetterWidgets \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/BetterWidgets-build" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Verify signature and architectures
        run: |
          app_path="$RUNNER_TEMP/BetterWidgets-build/Build/Products/Release/BetterWidgets.app"
          codesign --verify --deep --strict "$app_path"
          lipo "$app_path/Contents/MacOS/BetterWidgets" -verify_arch arm64 x86_64
